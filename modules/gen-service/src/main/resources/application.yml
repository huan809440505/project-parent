# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8100
  servlet:
    # 应用的访问路径
    context-path: /gen
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

spring:
  application:
    name: gen-service

# 日志配置
logging:
  level:
    com.hyl.rock: debug
    org.springframework: warn

# 代码生成
gen:
  # 作者
  author: hyl
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.hyl.web
  # 自动去除表前缀，默认是false
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_
  # 是否允许生成文件覆盖到本地（自定义路径），默认不允许
  allowOverwrite: false
