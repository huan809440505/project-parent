spring:
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      url: jdbc:mysql://rm-7xv1d91wp84bsvh6b3o.mysql.rds.aliyuncs.com:3306/blue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
      username: skhd001
      password: SKhd6712527Cc
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: ruoyi
        login-password: SKhd6712527Cc
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # redis配置
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 1
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # rabbitMQ配置
  rabbitmq:
    host: localhost # RabbitMQ 服务器地址（本地为 localhost，远程填服务器 IP）
    port: 5672       # 消息通信端口（默认 5672）
    username: guest # 登录账号（Docker 启动时配置的 RABBITMQ_DEFAULT_USER）
    password: guest # 登录密码（Docker 启动时配置的 RABBITMQ_DEFAULT_PASS）
    virtual-host: / # 虚拟主机（默认 /）
    # 生产者确认配置（可选，确保消息成功投递到交换机）
    publisher-confirm-type: correlated
    # 生产者退回配置（可选，消息无法路由到队列时回调）
    publisher-returns: true
    # 消费者配置（可选，手动确认消息，避免自动确认导致消息丢失）
    listener:
      simple:
        acknowledge-mode: manual # 手动确认消息（Ack）
        concurrency: 1            # 消费者最小线程数
        max-concurrency: 5        # 消费者最大线程数
        prefetch: 1               # 每次从队列拉取 1 条消息，处理完再拉取下一条（避免消息堆积）
