# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8093
  servlet:
    # 应用的访问路径
    context-path: /report
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

spring:
  application:
    name: report-service
  elasticsearch:
    uris: localhost:9200
    username: elastic
    password: 123456
    connection-timeout: 5000ms
    socket-timeout: 60000ms



# 日志配置
logging:
  level:
    com.hyl.rock: debug
    org.springframework: warn

#springdoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html