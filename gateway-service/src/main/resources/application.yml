server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            #系统服务
            - id: system-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=1
            #文件服务
            - id: file-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/file/**
              filters:
                - StripPrefix=1
            #报表服务
            - id: report-service
              uri: http://localhost:8093
              predicates:
                - Path=/api/report/**
              filters:
                - StripPrefix=1

#token相关配置
token:
  secret: my-secret-key
  headerName: token
  expireTime: 3600

#白名单配置
security:
  ignore:
    whites:
      - /user/login
      - /user/register
      - /report/*
      - /file/*
      - /system/*